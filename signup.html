
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | IPL Vault</title>

<link rel="icon" type="image/png" href="images/logo.png">

<link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


    <header class="header">

    <div class="logo">

    <img src="images/logo.png" alt="IPL Vault Logo">


            <span>🏏 IPL VAULT</span>

        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#teams">Teams</a>

            <a href="index.html#venues">Venues</a>

            <a href="index.html#tickets">Book Tickets</a>

            <a href="login.html">Login</a>

        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-box">

            <div class="auth-logo">
                🏏
            </div>

            <h1>Create Your Account</h1>

            <p class="auth-subtitle">
                Join IPL Vault and enjoy the ultimate cricket experience.
            </p>


            <form action="#" method="post">


                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>



                <div class="auth-field">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="auth-field">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="auth-button">

                    CREATE ACCOUNT

                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>

</body>

</html>
