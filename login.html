
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | IPL Vault</title>

<link rel="icon" type="image/png" href="images/logo.png">

<link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


    <header class="header">

        <div class="logo">

    <img src="images/logo.png" alt="IPL Vault Logo">

            <span>🏏 IPL VAULT</span>

        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#teams">Teams</a>

            <a href="index.html#venues">Venues</a>

            <a href="index.html#tickets">Book Tickets</a>

            <a href="signup.html" class="signup-link">
                Sign Up
            </a>

        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-box">

            <div class="auth-logo">
                🏏
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue your IPL Vault experience.
            </p>


            <form action="#" method="post">


                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>



                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    LOGIN

                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>

</body>

</html>
